<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --primary: #800000;
      --primary-hover: #600000;
      --bg-light: #f8f9fa;
      --card-bg: #ffffff;
      --border-color: #e0e0e0;
      --text-color: #333333;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f1ea; margin: 0; padding: 15px; color: var(--text-color); }
    
    .container { max-width: 900px; margin: 0 auto; }
    
    .header {
      background-color: var(--primary);
      color: white;
      padding: 20px;
      border-radius: 8px 8px 0 0;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .header h1 { margin: 0; font-size: 1.8rem; font-weight: 600; }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .section-title {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
      padding-bottom: 5px;
      margin-top: 15px;
      margin-bottom: 15px;
      font-size: 1.2rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 15px;
    }

    .form-group { display: flex; flex-direction: column; position: relative; }
    .form-group.full-width { grid-column: 1 / -1; }
    
    label { font-weight: 600; font-size: 0.88rem; margin-bottom: 5px; color: #444; }
    input, select, textarea {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      font-size: 0.95rem;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(128,0,0,0.1);
    }

    /* Dynamic Tables */
    .table-container { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    th { background-color: var(--primary); color: white; padding: 10px; text-align: left; font-size: 0.9rem; }
    td { padding: 8px; border: 1px solid var(--border-color); vertical-align: middle; }
    
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-primary { background-color: var(--primary); color: white; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-add { background-color: #27ae60; color: white; font-size: 0.85rem; }
    .btn-add:hover { background-color: #219150; }
    .btn-danger { background-color: #e74c3c; color: white; padding: 5px 10px; font-size: 0.8rem; }
    .btn-submit { width: 100%; padding: 14px; font-size: 1.1rem; border-radius: 6px; }

    /* Custom Searchable Dropdown List */
    .search-results {
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 0 0 5px 5px;
      max-height: 180px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: none;
    }
    .search-item { padding: 10px; cursor: pointer; font-size: 0.9rem; }
    .search-item:hover { background-color: #f0f0f0; color: var(--primary); }

    #statusMessage {
      margin-top: 15px;
      padding: 12px;
      border-radius: 5px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
    .status-loading { background: #fff3cd; color: #856404; }
    .status-success { background: #d4edda; color: #155724; }
    .status-error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Generate Claim Statement</h1>
    </div>

    <div class="card">
      <form id="claimForm">
        
        <!-- General Info Section -->
        <div class="section-title">General Details</div>
        <div class="form-grid">
          
          <div class="form-group">
            <label for="corporate">Corporate Name</label>
            <input type="text" id="corporate" placeholder="e.g. Bank Of America" required>
          </div>

          <div class="form-group">
            <label for="activityInput">Activity Name</label>
            <input type="text" id="activityInput" placeholder="Search Activity..." autocomplete="off" required>
            <div id="activityResults" class="search-results"></div>
          </div>

          <div class="form-group">
            <label for="letterDate">Letter Date</label>
            <input type="date" id="letterDate" required>
          </div>

          <div class="form-group">
            <label for="activityDate">Activity Date</label>
            <input type="date" id="activityDate" required>
          </div>

          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" placeholder="e.g. Mumbai / Bengaluru" required>
          </div>

          <div class="form-group full-width">
            <label for="address">Address</label>
            <textarea id="address" rows="2" placeholder="Full Client Address" required></textarea>
          </div>

        </div>

        <!-- Materials Table -->
        <div class="section-title">Materials to be Carried</div>
        <div class="table-container">
          <table id="materialsTable">
            <thead>
              <tr>
                <th style="width: 10%;">Sl. No.</th>
                <th style="width: 55%;">Material / Line Item</th>
                <th style="width: 25%;">Quantity</th>
                <th style="width: 10%;">Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <button type="button" class="btn btn-add" onclick="addMaterialRow()">+ Add Material Row</button>

        <!-- YFS Representatives Table -->
        <div class="section-title">Youth For Seva Representatives</div>
        <div class="table-container">
          <table id="repsTable">
            <thead>
              <tr>
                <th style="width: 10%;">Sl. No.</th>
                <th style="width: 45%;">Name</th>
                <th style="width: 35%;">Contact / Mobile</th>
                <th style="width: 10%;">Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <button type="button" class="btn btn-add" onclick="addRepRow()">+ Add Representative Row</button>

        <!-- Sign-off Block -->
        <div class="section-title">Authorized Signatory Info</div>
        <div class="form-grid">
          
          <div class="form-group">
            <label for="signoffSelect">Select Associate</label>
            <select id="signoffSelect" onchange="onSignoffSelectChange()">
              <option value="">-- Select or Choose Custom --</option>
            </select>
          </div>

          <div class="form-group">
            <label for="signoffName">Signatory Name</label>
            <input type="text" id="signoffName" required>
          </div>

          <div class="form-group">
            <label for="signoffDesignation">Designation</label>
            <input type="text" id="signoffDesignation" required>
          </div>

          <div class="form-group">
            <label for="signoffPhone">Contact Number</label>
            <input type="text" id="signoffPhone" required>
          </div>

        </div>

        <br>
        <button type="submit" class="btn btn-primary btn-submit">Generate PDF Document</button>
      </form>

      <div id="statusMessage"></div>
    </div>
  </div>

  <script>
    let globalActivities = [];
    let globalAssociates = [];

    window.onload = function() {
      // Set today's date as default
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('letterDate').value = today;
      document.getElementById('activityDate').value = today;

      // Fetch dynamic options from Google Sheet
      google.script.run.withSuccessHandler(data => {
        globalActivities = data.activities || [];
        globalAssociates = data.associates || [];
        populateAssociatesDropdown();
      }).getInitialData();

      setupActivitySearch();
    };

    /* Searchable Activity Dropdown Setup */
    function setupActivitySearch() {
      const input = document.getElementById('activityInput');
      const results = document.getElementById('activityResults');

      input.addEventListener('input', function() {
        const val = this.value.toLowerCase();
        results.innerHTML = '';
        if (!val) { results.style.display = 'none'; return; }

        const matches = globalActivities.filter(a => a.toLowerCase().includes(val));
        if (matches.length > 0) {
          matches.forEach(m => {
            const div = document.createElement('div');
            div.className = 'search-item';
            div.textContent = m;
            div.onclick = function() {
              input.value = m;
              results.style.display = 'none';
              loadActivityMaterials(m);
            };
            results.appendChild(div);
          });
          results.style.display = 'block';
        } else {
          results.style.display = 'none';
        }
      });

      document.addEventListener('click', function(e) {
        if (e.target !== input) results.style.display = 'none';
      });
    }

    /* Load Materials on Activity Selection */
    function loadActivityMaterials(actName) {
      showStatus('Loading materials for activity...', 'loading');
      google.script.run
        .withSuccessHandler(materials => {
          hideStatus();
          const tbody = document.querySelector('#materialsTable tbody');
          tbody.innerHTML = '';
          if (materials && materials.length > 0) {
            materials.forEach(m => addMaterialRow(m.item, m.quantity));
          } else {
            addMaterialRow(); // default blank row
          }
        })
        .getActivityMaterials(actName);
    }

    /* Dynamic Row Management: Materials */
    function addMaterialRow(item = '', qty = '') {
      const tbody = document.querySelector('#materialsTable tbody');
      const rowCount = tbody.rows.length + 1;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="sl-no">${rowCount}</td>
        <td><input type="text" class="mat-item" value="${item}" placeholder="Material Name"></td>
        <td><input type="text" class="mat-qty" value="${qty}" placeholder="e.g. 10 Pcs"></td>
        <td><button type="button" class="btn btn-danger" onclick="removeRow(this, 'materialsTable')">X</button></td>
      `;
      tbody.appendChild(tr);
    }

    /* Populate Associates Options */
    function populateAssociatesDropdown() {
      const select = document.getElementById('signoffSelect');
      globalAssociates.forEach((assoc, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = assoc.name;
        select.appendChild(opt);
      });
    }

    function onSignoffSelectChange() {
      const idx = document.getElementById('signoffSelect').value;
      if (idx !== "") {
        const assoc = globalAssociates[idx];
        document.getElementById('signoffName').value = assoc.name;
        document.getElementById('signoffDesignation').value = assoc.designation;
        document.getElementById('signoffPhone').value = assoc.contact;
      }
    }

    /* Dynamic Row Management: Representatives */
    function addRepRow(name = '', contact = '') {
      const tbody = document.querySelector('#repsTable tbody');
      const rowCount = tbody.rows.length + 1;
      
      let assocOptions = `<option value="">-- Choose or Enter Custom --</option>`;
      globalAssociates.forEach((assoc, i) => {
        assocOptions += `<option value="${i}">${assoc.name}</option>`;
      });

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="sl-no">${rowCount}</td>
        <td>
          <select onchange="onRepSelectChange(this)" style="margin-bottom: 4px;">${assocOptions}</select>
          <input type="text" class="rep-name" value="${name}" placeholder="Name">
        </td>
        <td><input type="text" class="rep-contact" value="${contact}" placeholder="Mobile Number"></td>
        <td><button type="button" class="btn btn-danger" onclick="removeRow(this, 'repsTable')">X</button></td>
      `;
      tbody.appendChild(tr);
    }

    function onRepSelectChange(selectElem) {
      const idx = selectElem.value;
      const row = selectElem.closest('tr');
      if (idx !== "") {
        const assoc = globalAssociates[idx];
        row.querySelector('.rep-name').value = assoc.name;
        row.querySelector('.rep-contact').value = assoc.contact;
      }
    }

    function removeRow(btn, tableId) {
      const row = btn.closest('tr');
      row.remove();
      // Re-index Sl No.
      const tbody = document.querySelector(`#${tableId} tbody`);
      Array.from(tbody.rows).forEach((r, idx) => {
        r.querySelector('.sl-no').textContent = idx + 1;
      });
    }

    /* Submit Form and Trigger PDF Generation */
    document.getElementById('claimForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      showStatus('⏳ Generating PDF... Download will start automatically.', 'loading');

      // Collect materials
      const materials = Array.from(document.querySelectorAll('#materialsTable tbody tr')).map(r => ({
        item: r.querySelector('.mat-item').value,
        quantity: r.querySelector('.mat-qty').value
      })).filter(m => m.item || m.quantity);

      // Collect representatives
      const reps = Array.from(document.querySelectorAll('#repsTable tbody tr')).map(r => ({
        name: r.querySelector('.rep-name').value,
        contact: r.querySelector('.rep-contact').value
      })).filter(r => r.name || r.contact);

      const payload = {
        corporate: document.getElementById('corporate').value,
        activityName: document.getElementById('activityInput').value,
        letterDate: document.getElementById('letterDate').value,
        activityDate: document.getElementById('activityDate').value,
        location: document.getElementById('location').value,
        address: document.getElementById('address').value,
        materials: materials,
        representatives: reps,
        signoffName: document.getElementById('signoffName').value,
        signoffDesignation: document.getElementById('signoffDesignation').value,
        signoffPhone: document.getElementById('signoffPhone').value
      };

      google.script.run
        .withSuccessHandler(function(result) {
          // DO NOT use window.open(result) here!
          // Convert the returned base64 string directly into a downloadable Blob:
          const byteCharacters = atob(result.base64);
          const byteNumbers = new Array(byteCharacters.length);
          for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
          }
          const byteArray = new Uint8Array(byteNumbers);
          const blob = new Blob([byteArray], { type: 'application/pdf' });

          // Trigger immediate browser file download
          const link = document.createElement('a');
          link.href = window.URL.createObjectURL(blob);
          link.download = result.filename;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          showStatus('✅ PDF generated and downloaded to your device!', 'success');
        })
        .withFailureHandler(function(err) {
          showStatus('❌ Error: ' + err.message, 'error');
        })
        .generateClaimStatementPDF(payload);
    });

    function showStatus(msg, type) {
      const el = document.getElementById('statusMessage');
      el.innerHTML = msg;
      el.className = 'status-' + type;
      el.style.display = 'block';
    }

    function hideStatus() {
      document.getElementById('statusMessage').style.display = 'none';
    }
  </script>
</body>
</html>
